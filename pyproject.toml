[project]
name = "karaoke"
version = "0.1.0"
description = "Desktop karaoke app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "audio-separator[gpu]",
    "audioread>=3.1.0",
    "fugashi>=1.5.2",
    "numpy>=2.5.4",
    "pyside6-essentials>=6.12.0",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "torch",
    "torchaudio>=2.11.0",
    "torchcrepe>=0.0.24",
    "transformers>=5.20.2",
    "unidic-lite>=1.0.8",
]

[project.scripts]
karaoke = "karaoke.cli:main"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
